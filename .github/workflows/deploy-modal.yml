name: Déployer sur Modal

# Déclenchement manuel : depuis github.com (onglet Actions), y compris sur
# téléphone. Le runner GitHub a un accès réseau complet, contrairement à
# l'environnement de développement dont le proxy ne supporte pas gRPC — or le
# client Modal est en gRPC.
on:
  workflow_dispatch:
    inputs:
      branche:
        description: "Branche à déployer"
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances du front
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Construire l'application web
        working-directory: frontend
        # Aucune URL de backend n'est injectée : l'app appelle /api en
        # relatif, et Modal sert l'app et l'API sur la même origine.
        run: npx expo export --platform web

      - name: Vérifier la sortie du build
        run: |
          set -e
          test -f frontend/dist/index.html
          echo "Build web : $(du -sh frontend/dist | cut -f1)"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer le client Modal
        run: pip install --upgrade modal

      - name: Déployer
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -e
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Secrets manquants. Ajoutez MODAL_TOKEN_ID et MODAL_TOKEN_SECRET dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Sans pipefail, le code de sortie du pipeline est celui de `tee`
          # (toujours 0) : un echec de build Modal passait pour un succes, et
          # l'ancien deploiement restait en ligne sans que personne le sache.
          set -o pipefail
          modal deploy deploy_modal.py | tee /tmp/deploy.log

      - name: Afficher l'URL de l'application
        if: success()
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.modal\.run' /tmp/deploy.log | head -1)
          if [ -n "$URL" ]; then
            echo "### Application déployée" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$URL**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Ouvrez ce lien sur votre téléphone, puis « Tester sans compte »." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::URL non trouvée dans la sortie du déploiement"
            exit 1
          fi

      - name: Vérifier que le déploiement répond
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.modal\.run' /tmp/deploy.log | head -1)
          echo "Vérification de $URL"
          # Deux attentes distinctes. D'abord que l'API reponde (demarrage a
          # froid). Ensuite que ce soit bien la NOUVELLE version : juste apres
          # un deploiement, un conteneur encore chaud peut servir l'ancienne
          # pendant quelques secondes — verifier trop tot donne un faux echec,
          # ce qui est exactement arrive au premier essai.
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 6
          done
          test "$CODE" = "200" || { echo "::error::API injoignable ($CODE)"; exit 1; }

          V2=""
          for i in $(seq 1 15); do
            if curl -s "$URL/openapi.json" | grep -q '"/api/analyze/v2"'; then V2=1; break; fi
            sleep 8
          done
          if [ -z "$V2" ]; then
            echo "::error::/api/analyze/v2 toujours absent apres 2 min — la version deployee n'est pas celle attendue"
            exit 1
          fi
          echo "API et moteur v2 en ligne."
